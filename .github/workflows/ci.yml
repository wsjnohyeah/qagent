name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --frozen
      - run: uv run flake8 src tests migrations
      - run: uv run mypy
      - run: uv run pytest --cov=agentic_quant --cov-report=term-missing
      - run: ./scripts/check_no_secrets.sh
      - run: docker build --build-arg SOURCE_GIT_SHA=${{ github.sha }} -t agentic-quant:${{ github.sha }} .

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Normalize GHCR image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SOURCE_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
