name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --frozen
      - run: uv run flake8 src tests
      - run: uv run mypy
      - run: uv run pytest --cov=agentic_quant --cov-report=term-missing
      - run: ./scripts/check_no_secrets.sh
      - run: docker build -t agentic-quant:${{ github.sha }} .
