name: agentic-quant-production

services:
  api:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable GHCR image tag}
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      DEPLOYMENT_ENVIRONMENT_ID: ${DEPLOYMENT_ENVIRONMENT_ID:?Set a unique environment ID}
      LIVE_TRADING_ENABLED: "false"
      PAPER_TRADING_ENABLED: "${PAPER_TRADING_ENABLED:-false}"
      GLOBAL_NEW_EXPOSURE_PAUSED: "true"
      AUTO_MIGRATE: "false"
      SHADOW_RUNTIME_ENABLED: "${SHADOW_RUNTIME_ENABLED:-true}"
      AUTONOMOUS_COORDINATOR_ENABLED: "${AUTONOMOUS_COORDINATOR_ENABLED:-true}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - object-store-data:/app/work/object-store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable GHCR image tag}
    command: ["python", "-m", "agentic_quant.worker"]
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      DEPLOYMENT_ENVIRONMENT_ID: ${DEPLOYMENT_ENVIRONMENT_ID:?Set a unique environment ID}
      LIVE_TRADING_ENABLED: "false"
      PAPER_TRADING_ENABLED: "${PAPER_TRADING_ENABLED:-false}"
      GLOBAL_NEW_EXPOSURE_PAUSED: "true"
      AUTO_MIGRATE: "false"
      SHADOW_RUNTIME_ENABLED: "true"
      AUTONOMOUS_COORDINATOR_ENABLED: "false"
    volumes:
      - object-store-data:/app/work/object-store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "agentic_quant.worker", "--healthcheck"]
      interval: 60s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  coordinator:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable GHCR image tag}
    command: ["python", "-m", "agentic_quant.worker"]
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      DEPLOYMENT_ENVIRONMENT_ID: ${DEPLOYMENT_ENVIRONMENT_ID:?Set a unique environment ID}
      LIVE_TRADING_ENABLED: "false"
      PAPER_TRADING_ENABLED: "false"
      GLOBAL_NEW_EXPOSURE_PAUSED: "true"
      AUTO_MIGRATE: "false"
      SHADOW_RUNTIME_ENABLED: "false"
      AUTONOMOUS_COORDINATOR_ENABLED: "${AUTONOMOUS_COORDINATOR_ENABLED:-true}"
      COORDINATOR_PAID_RESEARCH_ENABLED: "${COORDINATOR_PAID_RESEARCH_ENABLED:-false}"
      MARKET_SCANNER_ENABLED: "${MARKET_SCANNER_ENABLED:-false}"
      MARKET_SCANNER_LLM_ENABLED: "${MARKET_SCANNER_LLM_ENABLED:-false}"
      MARKET_SCANNER_AUTO_TRADING_POOL_ENABLED: "${MARKET_SCANNER_AUTO_TRADING_POOL_ENABLED:-false}"
    volumes:
      - object-store-data:/app/work/object-store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "agentic_quant.worker", "--healthcheck", "--pipeline", "coordinator"]
      interval: 60s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    env_file: ${APP_ENV_FILE:-.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-store-data:
