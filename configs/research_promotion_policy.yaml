version: research_gate@0.2.0

# These gates only determine eligibility for later human review. They never promote a
# strategy or authorize shadow/paper execution automatically.
minimum_oos_folds: 12
minimum_candidate_count: 3
minimum_regime_count: 2
maximum_probability_of_backtest_overfitting: 0.20
minimum_deflated_sharpe_probability: 0.95
minimum_positive_oos_fold_rate: 0.55
maximum_allowed_drawdown: -0.20
