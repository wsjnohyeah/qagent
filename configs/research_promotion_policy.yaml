version: research_gate@0.5.0

# These gates determine evidence eligibility. A separately enabled deterministic coordinator
# may auto-admit an exact eligible strategy to broker-free Shadow; the gate never authorizes
# Paper, live money, or an LLM-controlled transition.
minimum_oos_folds: 12
minimum_active_oos_folds: 8
minimum_oos_trades: 30
minimum_candidate_count: 3
minimum_regime_count: 2
maximum_probability_of_backtest_overfitting: 0.20
minimum_deflated_sharpe_probability: 0.95
minimum_positive_active_oos_fold_rate: 0.55
maximum_allowed_drawdown: -0.20

# Candidate Shadow is broker-free forward observation, never qualification or Paper.
# It may omit DSR/PBO thresholds, but still requires an exact static specification,
# real OOS activity, positive cost-adjusted OOS return, and bounded drawdown.
candidate_shadow_minimum_oos_folds: 6
candidate_shadow_minimum_active_oos_folds: 4
candidate_shadow_minimum_oos_trades: 30
candidate_shadow_minimum_compounded_oos_return: 0
candidate_shadow_maximum_allowed_drawdown: -0.20
candidate_shadow_minimum_positive_active_oos_fold_rate: 0.50
candidate_shadow_minimum_profit_factor: 1.10
candidate_shadow_require_positive_return_without_best_trade: true

# Candidate Shadow exists to collect broker-free forward evidence. Activity minima
# scale with the number of independent windows a five-year history can actually
# provide at each holding horizon. Profit after modeled costs and the drawdown cap
# remain mandatory; these overrides do not qualify a strategy for Paper.
candidate_shadow_horizon_thresholds:
  1:
    minimum_oos_folds: 6
    minimum_active_oos_folds: 4
    minimum_oos_trades: 30
  2:
    minimum_oos_folds: 6
    minimum_active_oos_folds: 4
    minimum_oos_trades: 25
  5:
    minimum_oos_folds: 6
    minimum_active_oos_folds: 4
    minimum_oos_trades: 20
  10:
    minimum_oos_folds: 6
    minimum_active_oos_folds: 4
    minimum_oos_trades: 15
  20:
    minimum_oos_folds: 5
    minimum_active_oos_folds: 3
    minimum_oos_trades: 10
  63:
    minimum_oos_folds: 4
    minimum_active_oos_folds: 2
    minimum_oos_trades: 3
  126:
    minimum_oos_folds: 2
    minimum_active_oos_folds: 1
    minimum_oos_trades: 2
  252:
    minimum_oos_folds: 1
    minimum_active_oos_folds: 1
    minimum_oos_trades: 1
