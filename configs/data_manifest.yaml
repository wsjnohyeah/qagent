version: data_manifest@0.6.0
providers:
  synthetic:
    enabled: true
    purpose: deterministic_phase_0_replay
  alpaca:
    enabled: true
    purpose: phase_1_market_data_and_paper_broker
    entitlement_status: verified_2026-09-03
    stock_feed: sip
    option_feed: opra
    supported_bar_timeframes: [1Min, 1Day]
    daily_bar_availability: exchange_session_close
    execution_enabled: false
market_calendar: XNYS
research:
  feature_set: price_event_pit@0.2.0
  point_in_time_required: true
  next_bar_execution_required: true
  offline_online_parity_required: true
  corporate_actions:
    raw_prices_required: true
    split_adjusted_features: true
    backtest_cash_share_simulation: event_driven
    symbol_change_replay: pending_fail_closed
  backtest_engine:
    version: event_driven_portfolio@0.1.0
    order_timing: next_bar_open
    exit_timing: declared_session_close
    max_volume_participation_default: 0.05
    fixed_market_impact_bps_per_side_default: 1.0
  validation:
    method: rolling_walk_forward
    minimum_embargo_bars: 1
    overlapping_test_windows_allowed: false
    selection_failure_diagnostic: selected_oos_below_median_rate
    regimes: [up, down, sideways]
  universe_membership:
    effective_intervals_required: true
    availability_timestamp_required: true
  synthetic_smoke_is_alpha_evidence: false
