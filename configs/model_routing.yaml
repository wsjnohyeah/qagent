version: llm_routing@0.1.0

providers:
  openai:
    model: gpt-5.6-sol
    base_url: https://api.openai.com/v1
    cost_tier: premium
    reasoning_effort: high
    max_output_tokens: 8192
    timeout_seconds: 300
    max_retries: 2
    send_store_false: true
  meta:
    model: muse-spark-1.3
    base_url: https://api.meta.ai/v1
    cost_tier: value
    reasoning_effort: minimal
    max_output_tokens: 4096
    timeout_seconds: 600
    max_retries: 2
    send_store_false: false
    temperature: 1.0
    top_p: 1.0

routes:
  interactive_explanation: meta
  routine_pipeline: meta
  critical_research: openai
  strategy_generation: openai
  strategy_critique: openai

# Automatic cross-provider fallback is intentionally disabled. A fallback can silently
# change cost, behavior, and reproducibility; future route changes must be explicit and
# versioned through the authenticated Control Center.
