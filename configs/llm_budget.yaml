version: llm_budget@0.4.0

# Meta pricing synced to the official Meta Model API rate card on 2026-09-19
# (muse-spark-1.3 standard: 1.25/4.25 USD per MTok in/out; verified against Meta receipts).
pricing_usd_per_million_tokens:
  openai:
    input: "5.00"
    output: "20.00"
  meta:
    input: "1.25"
    output: "4.25"

reservation:
  # One input token per UTF-8 byte intentionally over-reserves for a fail-closed ceiling.
  input_bytes_per_token: 1

limits:
  project_daily:
    max_estimated_cost_usd: "10.00"
  project_monthly:
    max_estimated_cost_usd: "1400.00"
  provider_daily:
    openai:
      max_estimated_cost_usd: "5.00"
    meta:
      # All active workloads route to Meta; sub-limits are scaled 1/8 with the
      # $10 project cap (was $80) so no workload can exceed the project ceiling.
      max_estimated_cost_usd: "10.00"
  workload_daily:
    interactive_explanation:
      max_estimated_cost_usd: "0.625"
    routine_pipeline:
      max_estimated_cost_usd: "0.625"
    critical_research:
      max_estimated_cost_usd: "5.00"
    event_research:
      max_estimated_cost_usd: "5.00"
    strategy_generation:
      max_estimated_cost_usd: "1.875"
    strategy_critique:
      max_estimated_cost_usd: "1.875"
