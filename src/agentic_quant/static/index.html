background:#0d1312}.markdown-body th{background:#131c1a;color:#d9e4e0}.markdown-body tr:last-child td{border-bottom:0}.markdown-body hr{height:1px;margin:1.4em 0;border:0;background:#2b3735}.citations{display:flex;flex-wrap:wrap;gap:5px;margin-top:13px;padding-top:10px;border-top:1px solid #2a3533}.citation{color:var(--mint);font:10px "SFMono-Regular",monospace}.action-card{align-self:flex-start;width:min(100%,820px);border:1px solid #785e34;background:#241d12;border-radius:11px;padding:14px;font-size:12px}.action-card p{color:#d4c5a9}.action-card pre{max-height:150px;margin:9px 0;font-size:10px}.steward-compose{border-top:1px solid var(--line);padding:14px max(22px,calc((100% - 920px)/2)) 16px;background:#0d1212;display:grid;gap:9px}.steward-compose textarea{min-height:76px;max-height:220px}.compose-row{display:flex;justify-content:space-between;align-items:center;gap:9px}.compose-controls{display:flex;align-items:center;gap:8px}.compose-controls select{width:140px}.compose-hint{color:var(--muted);font-size:10px}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;background:#1b2523;border:1px solid #41544f;border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px}.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px}.modal-card{width:min(570px,100%);max-height:86vh;overflow:auto;background:#121817;border:1px solid #3c4d49;border-radius:15px;padding:22px;box-shadow:var(--shadow)}.modal-card pre{margin:14px 0;max-height:260px;font-size:11px}.form{display:grid;gap:10px}.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

<body>
  <section id="login" class="login">
    <form id="login-form" class="login-card">
      <div class="mark">AQ</div><div class="eyebrow">Private control plane</div><h1>欢迎回来</h1><p class="muted">登录后才能查看数据、研究与 shadow 操作。</p>
      <div class="stack"><input id="username" autocomplete="username" placeholder="Admin username" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="primary" type="submit">Unlock Control Center</button><div id="login-error" class="error"></div></div>
    </form>
  </section>
  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><div class="mark">AQ</div><div><strong>Agentic Quant</strong><div class="tiny">CONTROL CENTER</div></div></div>
      <nav id="nav">
        <button class="nav active" data-page="steward"><span class="nav-icon">✦</span>System Steward</button><button class="nav" data-page="overview"><span class="nav-icon">◫</span>Overview</button><button class="nav" data-page="lists"><span class="nav-icon">◎</span>Lists</button><button class="nav" data-page="data"><span class="nav-icon">≋</span>Data explorer</button><button class="nav" data-page="strategies"><span class="nav-icon">◇</span>Strategies</button><button class="nav" data-page="shadow"><span class="nav-icon">◉</span>Shadow</button><button class="nav" data-page="pipelines"><span class="nav-icon">↳</span>Pipelines</button><button class="nav" data-page="models"><span class="nav-icon">◌</span>Models</button><button class="nav" data-page="activity"><span class="nav-icon">↻</span>Audit &amp; activity</button><button class="nav" data-page="code"><span class="nav-icon">⌘</span>Steward code work</button>
      </nav>
      <div class="sidebar-foot"><div class="eyebrow">Hard boundary</div><div style="margin-top:7px;font-size:12px">Shadow only<br><span class="muted">No broker order path</span></div></div>
    </aside>
    <main class="main"><header class="topbar"><div id="runtime-status" class="status"><span class="dot"></span><span>Connecting</span></div><div class="top-actions"><button id="runtime-button">Pause</button><button id="logout" class="hide-mobile">Log out</button></div></header><div id="content"><div class="empty">Loading system state…</div></div></main>
  </div>
  <div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const state={session:null,system:null,summary:null,page:'steward',context:{type:null,id:null,label:'Whole system'},conversation:null,routes:null};
const $=s=>document.querySelector(s);const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const j=v=>JSON.stringify(v,null,2);const short=v=>String(v||'—').slice(0,12);const when=v=>v?new Date(v).toLocaleString():'—';
function inlineMarkdown(value){const code=[];let text=e(value).replace(/`([^`\n]+)`/g,(_,body)=>{const token=`\u0000CODE${code.length}\u0000`;code.push(`<code>${body}</code>`);return token});text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');code.forEach((html,index)=>{text=text.replace(`\u0000CODE${index}\u0000`,html)});return text}
function markdownCells(line){let value=line.trim();if(value.startsWith('|'))value=value.slice(1);if(value.endsWith('|'))value=value.slice(0,-1);return value.split('|').map(cell=>cell.trim())}
function renderMarkdown(value){const lines=String(value??'').replace(/\r\n?/g,'\n').split('\n'),out=[];let index=0;while(index<lines.length){const line=lines[index];if(!line.trim()){index+=1;continue}const fence=line.match(/^\s*```([\w+-]*)\s*$/);if(fence){const body=[];index+=1;while(index<lines.length&&!/^\s*```\s*$/.test(lines[index])){body.push(lines[index]);index+=1}if(index<lines.length)index+=1;out.push(`<pre><code${fence[1]?` data-language="${e(fence[1])}"`:''}>${e(body.join('\n'))}</code></pre>`);continue}const headingMatch=line.match(/^\s*(#{1,4})\s+(.+)$/);if(headingMatch){const level=headingMatch[1].length;out.push(`<h${level}>${inlineMarkdown(headingMatch[2])}</h${level}>`);index+=1;continue}if(/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(line)){out.push('<hr>');index+=1;continue}if(index+1<lines.length&&line.includes('|')){const headings=markdownCells(line),divider=markdownCells(lines[index+1]);if(headings.length>1&&divider.length===headings.length&&divider.every(cell=>/^:?-{3,}:?$/.test(cell))){index+=2;const rows=[];while(index<lines.length&&lines[index].trim()&&lines[index].includes('|')){rows.push(markdownCells(lines[index]));index+=1}out.push(`<div class="markdown-table-wrap"><table><thead><tr>${headings.map(cell=>`<th>${inlineMarkdown(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${headings.map((_,cellIndex)=>`<td>${inlineMarkdown(row[cellIndex]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue}}const listMatch=line.match(/^\s*(?:([-+*])|(\d+)\.)\s+(.+)$/);if(listMatch){const ordered=Boolean(listMatch[2]),tag=ordered?'ol':'ul',items=[];while(index<lines.length){const item=lines[index].match(/^\s*(?:([-+*])|(\d+)\.)\s+(.+)$/);if(!item||Boolean(item[2])!==ordered)break;items.push(`<li>${inlineMarkdown(item[3])}</li>`);index+=1}out.push(`<${tag}>${items.join('')}</${tag}>`);continue}if(/^\s*>\s?/.test(line)){const quote=[];while(index<lines.length&&/^\s*>\s?/.test(lines[index])){quote.push(lines[index].replace(/^\s*> ss="tiny">page size ${e(x.limit)}</span></div><div style="overflow:auto"><table><thead><tr><th>Received</th><th>Ingested</th><th>Bytes</th><th>Hash</th></tr></thead><tbody>${x.raw_objects.map(v=>`<tr class="clickable open-raw" data-id="${e(v.raw_object_id)}"><td>${e(when(v.provider_received_at))}</td><td>${e(when(v.ingested_at))}</td><td>${e(v.payload_bytes)}</td><td class="mono">${e(short(v.content_sha256))}</td></tr>`).join('')||'<tr><td colspan="4">No objects in this filter</td></tr>'}</tbody></table></div><div class="actions section-pad"><button id="prev-page" ${offset===0?'disabled':''}>Previous</button><button id="next-page" ${offset+x.limit>=x.total?'disabled':''}>Next</button></div></section>`;$('#back').onclick=()=>navigate('data');document.querySelectorAll('.date-filter').forEach(b=>b.onclick=()=>openDataset(provider,type,0,b.dataset.day));document.querySelectorAll('.open-raw').forEach(v=>v.onclick=()=>openRaw(v.dataset.id));$('#prev-page').onclick=()=>openDataset(provider,type,Math.max(0,offset-x.limit),day);$('#next-page').onclick=()=>openDataset(provider,type,offset+x.limit,day)}
async function openBars(symbol,timeframe,offset=0,day=''){const query=new URLSearchParams({limit:'50',offset:String(offset)});if(day)query.set('day',day);const x=await api(`/v1/explorer/market-bars/${encodeURIComponent(symbol)}/${encodeURIComponent(timeframe)}?${query}`);setContext('dataset',`${symbol}:${timeframe}`,`${symbol} ${timeframe} bars`);$('#content').innerHTML=heading(`${symbol} · ${timeframe}`,`${x.total} normalized bars; newest first.`,'<button id="back">← Data explorer</button>')+`<section class="section section-pad"><div class="eyebrow">Group by market date</div><div class="chips"><button class="bar-date" data-day="">All</button>${x.date_groups.map(g=>`<button class="bar-date" data-day="${e(g.date)}">${e(g.date)} · ${e(g.count)}</button>`).join('')}</div></section><section class="section"><div style="overflow:auto"><table><thead><tr><th>Event / available</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Volume</th><th>Source</th></tr></thead><tbody>${x.items.map(v=>`<tr><td>${e(when(v.event_time))}<div class="tiny">available ${e(when(v.available_from))}</div></td><td>${e(v.open)}</td><td>${e(v.high)}</td><td>${e(v.low)}</td><td>${e(v.close)}</td><td>${e(v.volume)}</td><td>${e(v.source)} / ${e(v.feed)}</td></tr>`).join('')||'<tr><td colspan="7">No bars in this filter</td></tr>'}</tbody></table></div><div class="actions section-pad"><button id="prev-page" ${offset===0?'disabled':''}>Previous</button><button id="next-page" ${offset+x.limit>=x.total?'disabled':''}>Next</button></div></section>`;$('#back').onclick=()=>navigate('data');document.querySelectorAll('.bar-date').forEach(b=>b.onclick=()=>openBars(symbol,timeframe,0,b.dataset.day));$('#prev-page').onclick=()=>openBars(symbol,timeframe,Math.max(0,offset-x.limit),day);$('#next-page').onclick=()=>openBars(symbol,timeframe,offset+x.limit,day)}

async function renderStrategies(){const values=await api('/v1/strategies');$('#content').innerHTML=heading('Strategy registry','每一张卡是一个不可变 executable spec；参数或代码变化会产生新版本，旧验证不可借用。')+`<section class="section section-pad"><strong>How to read this page</strong><p class="muted">Research-only = 只有回测记录；eligible static validation + 人工确认后才能 adopted；Shadow/Paper 结果与训练/验证结果分开显示。buy_and_hold 是跨期持仓的研究基准，不可直接部署到 one-bar Shadow runtime。</p></section><details class="section section-pad"><summary>Generate an ML + LLM research candidate</summary><p class="muted">The generator combines one point-in-time feature snapshot, its ML forecast, and a completed cited LLM analysis. A second critique call must accept a bounded momentum/mean-reversion DSL. Output remains research-only and must pass exact-spec validation plus human adoption.</p><div class="form" style="margin-top:12px"><input id="candidate-feature" placeholder="feature_snapshot_id"><input id="candidate-analysis" placeholder="analysis_id"><input id="candidate-forecast" placeholder="forecast_id"><select id="candidate-provider"><option value="">Auto route</option><option value="openai">OpenAI</option><option value="meta">Meta</option></select><button id="generate-candidate" class="primary">Generate and critique</button></div></details><div class="grid">${values.map(x=>`<article class="card clickable open-strategy" data-id="${e(x.strategy_spec_id)}"><div class="row"><div class="eyebrow">${e(x.strategy_type)} · ${e(x.timeframe)}</div>${badge(x.adoption_status||'research only')}</div><h2 style="margin-top:12px">${e(x.name)}</h2><p class="mono">${e(x.version)}</p><div class="chips">${(x.symbols||[]).map(v=>`<span class="chip">${e(v)}</span>`).join('')||'<span class="chip">no symbol runs</span>'}</div><div class="row" style="margin-top:15px"><span class="tiny">${e(x.experiment_count)} experiments · ${e(x.trade_count)} replay trades</span><span class="tiny">${x.latest_metrics?`latest return ${e(x.latest_metrics.total_return)}`:'no metrics'}</span></div></article>`).join('')||'<div class="empty">No strategy specifications yet</div>'}</div>`;document.querySelectorAll('.open-strategy').forEach(x=>x.onclick=()=>openStrategy(x.dataset.id));$('#generate-candidate').onclick=async()=>{const button=$('#generate-candidate');button.disabled=true;button.textContent='Generating…';try{const provider=$('#candidate-provider').value||null,result=await api('/v1/research/strategy-candidates',{method:'POST',body:j({feature_snapshot_id:$('#candidate-feature').value,analysis_id:$('#candidate-analysis').value,forecast_id:$('#candidate-forecast').value,provider})});if(result.strategy_spec){toast('Research candidate compiled; validation is still required');await openStrategy(result.strategy_spec.strategy_spec_id)}else{toast(`Critique rejected candidate: ${(result.critique?.reasons||[]).join(', ')}`)}}catch(err){toast(String(err))}finally{button.disabled=false;button.textContent='Generate and critique'}}}
async function openStrategy(id){const x=await api(`/v1/strategies/${encodeURIComponent(id)}`);setContext('strategy',id,x.name);const validationRows=x.validations.map(v=>`<tr><td class="mono">${e(short(v.validation_report_id))}</td><td>${e(v.validation_subject)}</td><td>${badge(v.gate_assessment?.status||'unknown')}</td><td>${e(v.aggregate_metrics?.compounded_selected_oos_return??'—')}</td><td>${e(when(v.created_at))}</td></tr>`).join('');const experimentRows=x.experiments.map(v=>`<tr><td>${e(v.symbol)}</td><td>${e(when(v.as_of_start))} → ${e(when(v.as_of_end))}</td><td>${e(v.metrics_json?.trade_count)}</td><td>${e(v.metrics_json?.total_return)}</td><td>${e(v.metrics_json?.max_drawdown)}</td></tr>`).join('');const tradeRows=x.trades.slice(0,100).map(v=>`<tr><td>${e(v.symbol)}</td><td>${e(when(v.entry_time))}</td><td>${e(v.quantity)}</td><td>${e(v.entry_price)} → ${e(v.exit_price)}</td><td>${e(v.net_pnl)}</td></tr>`).join('');$('#content').innerHTML=heading(x.name,`${x.strategy_type} · ${x.timeframe} · exact version ${x.version}`,'<button id="back">← Strategies</button>')+metrics([['State',x.adoption_status||'RESEARCH_ONLY','promotion'],['Experiments',x.experiment_count,'train/test runs included'],['Replay trades',x.trade_count,'not live performance'],['Shadow deployments',x.shadow_deployments.length,'virtual only']])+`<div class="split"><section class="section section-pad"><div class="row"><h2>Executable specification</h2>${badge(x.adoption_status||'research only')}</div><pre style="margin-top:14px">${e(j({strategy_spec_id:x.strategy_spec_id,parameters:x.parameters_json,data_requirements:x.data_requirements_json,code_sha256:x.code_sha256}))}</pre></section><section class="section section-pad"><h2>What created it?</h2><p class="muted">The provenance fields show whether this immutable spec came from the deterministic baseline runner or the constrained ML + LLM generator. It remains research-only until a <code>static_strategy</code> report bound to this exact ID passes the gate and a human confirms adoption.</p><pre>${e(j(x.latest_metrics||{status:'No completed experiment metrics'}))}</pre></section></div><section class="section"><div class="section-head"><h2>Validation evidence</h2><span class="tiny">exact-spec bound</span></div><div style="overflow:auto"><table><thead><tr><th>Report</th><th>Subject</th><th>Gate</th><th>OOS return</th><th>Created</th></tr></thead><tbody>${validationRows||'<tr><td colspan="5">No validation certificate bound to this exact spec</td></tr>'}</tbody></table></div></section><section class="section"><div class="section-head"><h2>Backtest experiments</h2><span class="tiny">latest 100</span></div><div style="overflow:auto"><table><thead><tr><th>Symbol</th><th>Window</th><th>Trades</th><th>Return</th><th>Drawdown</th></tr></thead><tbody>${experimentRows||'<tr><td colspan="5">No experiments</td></tr>'}</tbody></table></div></section><section class="section"><div class="section-head"><h2>Replay trade ledger</h2><span class="tiny">latest 100; research simulation</span></div><div style="overflow:auto"><table><thead><tr><th>Symbol</th><th>Entry</th><th>Qty</th><th>Prices</th><th>Net P&amp;L</th></tr></thead><tbody>${tradeRows||'<tr><td colspan="5">No replay trades</td></tr>'}</tbody></table></div></section><section class="section section-pad"><h2>Adoption workflow</h2><p class="muted">Paste an eligible static validation report that is cryptographically bound to this exact spec. Selector-level and legacy reports fail closed.</p><div class="form"><input id="validation-id" placeholder="validation_report_id"><input id="adopt-reason" value="Administrator reviewed exact deterministic validation evidence"><button id="adopt" class="primary">Preview shadow adoption</button></div></section><div id="forum"></div>`;$('#back').onclick=()=>navigate('strategies');$('#adopt').onclick=async()=>{try{const a=await api('/v1/actions',{method:'POST',body:j({action_type:'strategy.adopt',target_type:'strategy',target_id:id,parameters:{validation_report_id:$('#validation-id').value},reason:$('#adopt-reason').value})});showConfirmation(a)}catch(err){toast(String(err))}};if(x.adoption_status==='ADOPTED_FOR_SHADOW'){$('#forum').insertAdjacentHTML('beforebegin',`<section class="section section-pad"><h2>Start shadow deployment</h2><div class="form" style="margin-top:12px"><input id="shadow-symbol" placeholder="Symbol, e.g. AAPL"><input id="shadow-cash" value="100000" inputmode="decimal"><button id="start-shadow" class="primary">Preview deployment</button></div></section>`);$('#start-shadow').onclick=()=>proposeSimple('shadow.start','strategy',id,'Start confirmed broker-free shadow deployment',{strategy_spec_id:id,symbol:$('#shadow-symbol').value,initial_cash:$('#shadow-cash').value})}renderForum('strategy',id,x.name,x.discussion)}
async function renderShadow(){const[deps,runs,events,reports,alerts]=await Promise.all([api('/v1/shadow/deployments'),api('/v1/shadow/runs?limit=20'),api('/v1/shadow/events?limit=100'),api('/v1/shadow/reports?period=daily&limit=14'),api('/v1/shadow/alerts?limit=30')]);$('#content').innerHTML=heading('Shadow simulation','内部、无券商的前向工作流模拟；Alpaca paper trading 属于 Phase 7，二者不是同一件事。')+metrics([['Deployments',deps.length,'all states'],['Active',deps.filter(x=>x.status==='ACTIVE').length,'scheduler eligible'],['Virtual events',events.length,'latest 100'],['Open alerts',alerts.length,'deduplicated runtime facts']])+`<section class="section section-pad"><strong>What “shadow” means</strong><p class="muted">每个已采用的 strategy 在已存储数据上自动产生 signal candidate，经确定性 risk decision 和 trade plan 后才进入虚拟成交账本。它不连接 Alpaca account，也不会提交 paper/live order。</p></section><section class="section"><div class="section-head"><h2>Deployments</h2><span class="tiny">virtual cash accounting</span></div><div style="overflow:auto"><table><thead><tr><th>Strategy / symbol</th><th>Status</th><th>Cash</th><th>Realized P&amp;L</th><th>Last bar</th></tr></thead><tbody>${deps.map(x=>`<tr class="clickable open-shadow" data-id="${e(x.shadow_deployment_id)}"><td>${e(x.strategy_name)} / ${e(x.symbol)}</td><td>${badge(x.status)}</td><td>${e(x.cash_balance)}</td><td>${e(x.realized_pnl)}</td><td>${e(when(x.last_processed_bar_time))}</td></tr>`).join('')||'<tr><td colspan="5">No deployments. Adopt an exact-spec, gate-eligible strategy first.</td></tr>'}</tbody></table></div></section><div class="split"><section class="section"><div class="section-head"><h2>Daily reports</h2><span class="tiny">derived from durable events</span></div>${reports.map(x=>`<div class="post"><div class="post-meta"><span>${e(x.period_start)} · ${e(x.symbols.join(', ')||'no symbols')}</span><span>${e(x.deployment_count)} deployments</span></div><div>${e(x.round_trip_count)} round trips · ${e(x.approved_count)} approved · ${e(x.rejected_count)} rejected · P&amp;L ${e(x.realized_pnl)}</div></div>`).join('')||'<div class="empty">No reportable shadow activity yet</div>'}</section><section class="section"><div class="section-head"><h2>Operational alerts</h2><span class="tiny">deduplicated by deployment, reason, and day</span></div>${alerts.map(x=>`<div class="post"><div class="post-meta"><span>${badge(x.severity)} ${e(x.kind)}</span><span>${e(when(x.last_seen_at))}</span></div><div>${e(x.symbol||'runtime')} · ${e((x.reason_codes||[]).join(', '))} · ${e(x.occurrence_count)} occurrence(s)</div></div>`).join('')||'<div class="empty">No current runtime alerts</div>'}</section></div><section class="section"><div class="section-head"><h2>Runtime history</h2><span class="tiny">scheduler and manual diagnostics</span></div>${runs.map(x=>`<div class="post"><div class="post-meta"><span>${e(x.trigger)} · ${e(x.status)}</span><span>${e(when(x.finished_at))}</span></div><div>${e(x.bars_processed)} bars · ${e(x.events_created)} events · ${e(x.deployment_count)} deployments</div></div>`).join('')||'<div class="empty">No shadow runs yet</div>'}</section><details class="section section-pad"><summary>Advanced diagnostic controls</summary><p class="muted">Run one tick forces one idempotent scheduler pass now. It is for testing newly ingested bars, not a trade command.</p><button id="tick">Run one diagnostic tick</button></details>`;document.querySelectorAll('.open-shadow').forEach(x=>x.onclick=()=>openShadow(x.dataset.id));$('#tick').onclick=()=>proposeSimple('shadow.tick','runtime','shadow','Run one manually confirmed diagnostic scheduler pass',{})}
async function openShadow(id){const x=await api(`/v1/shadow/deployments/${encodeURIComponent(id)}`);setContext('shadow',id,`${x.strategy_name} / ${x.symbol}`);const decisions=x.decision_lineage||[];$('#content').innerHTML=heading(`${x.strategy_name} / ${x.symbol}`,'Broker-free shadow deployment with candidate → risk → plan → virtual fill lineage.','<button id="back">← Shadow</button>')+metrics([['Status',x.status,'deployment'],['Cash',x.cash_balance,'virtual'],['Realized P&L',x.realized_pnl,'after modeled costs'],['Risk decisions',decisions.length,'latest 100']])+`<section class="section"><div class="section-head"><h2>Decision lineage</h2><span class="tiny">every attempted new exposure</span></div><div style="overflow:auto"><table><thead><tr><th>Signal time</th><th>Decision</th><th>Reasons</th><th>Risk / qty</th><th>Plan</th></tr></thead><tbody>${decisions.map(v=>`<tr><td>${e(when(v.as_of))}</td><td>${badge(v.verdict)}</td><td>${e((v.reason_codes_json||[]).join(', '))}</td><td>${e(v.risk_budget_usd)} / ${e(v.max_quantity)}</td><td>${e(v.trade_plan_id?`${short(v.trade_plan_id)} · ${v.plan_status}`:'none')}</td></tr>`).join('')||'<tr><td colspan="5">No candidate decisions yet</td></tr>'}</tbody></table></div></section><section class="section"><div class="section-head"><h2>Virtual event journal</h2><span class="tiny">never broker orders</span></div><div style="overflow:auto"><table><thead><tr><th># / type</th><th>Time</th><th>Cash</th><th>Quantity</th><th>Price</th></tr></thead><tbody>${x.events.map(v=>`<tr><td>${e(v.sequence)} · ${e(v.event_type)}</td><td>${e(when(v.event_time))}</td><td>${e(v.cash_balance)}</td><td>${e(v.position_quantity)}</td><td>${e(v.price)}</td></tr>`).join('')||'<tr><td colspan="5">No newly available bars processed</td></tr>'}</tbody></table></div></section><div class="actions"><button id="shadow-pause">${x.status==='ACTIVE'?'Pause':'Resume'}</button><button id="shadow-retire" class="danger">Retire</button></div><div id="forum"></div>`;$('#back').onclick=()=>navigate('shadow');$('#shadow-pause').onclick=()=>proposeSimple(x.status==='ACTIVE'?'shadow.pause':'shadow.resume','shadow',id,`Administrator ${x.status==='ACTIVE'?'paused':'resumed'} deployment`,{});$('#shadow-retire').onclick=()=>proposeSimple('shadow.retire','shadow',id,'Administrator retired deployment',{});renderForum('shadow',id,`${x.strategy_name} / ${x.symbol}`,x.discussion)}
async function renderPipelines(){const[jobs,quality,controls]=await Promise.all([api('/v1/workflow-jobs'),api('/v1/data-quality'),api('/v1/runtime/controls')]);$('#content').innerHTML=heading('Pipelines','控制开关、worker heartbeat、可恢复分区任务和数据质量证明。')+`<section class="section section-pad"><strong>Terms</strong><p class="muted"><b>Pipeline control</b> 只是允许/禁止某类工作；<b>worker heartbeat</b> 才说明进程最近真的运行过。<b>Workflow job</b> 是可重试、可续跑的数据分区；<b>Quality report</b> 是某个数据窗口的结构、时间和完整性检查。</p></section><section class="section"><div class="section-head"><h2>Pipeline controls</h2><span class="tiny">permission is not liveness</span></div><div class="grid section-pad">${controls.pipelines.map(x=>`<div class="card"><div class="row"><strong>${e(x.pipeline)}</strong>${badge(x.enabled?'enabled':'paused')}</div><p>Worker: ${x.worker?`${e(x.worker.status)} · ${e(x.worker.detail)} · ${e(when(x.worker.heartbeat_at))}`:'No heartbeat: no resident worker is currently reporting for this pipeline.'}</p><button class="pipeline-toggle" data-name="${e(x.pipeline)}" data-enabled="${x.enabled}" style="margin-top:10px">${x.enabled?'Pause':'Enable'}</button></div>`).join('')}</div></section><div class="split"><section class="section"><div class="section-head"><h2>Workflow jobs</h2><span class="tiny">${jobs.length} recent</span></div>${jobs.map(x=>`<div class="post clickable open-job" data-id="${e(x.workflow_job_id)}"><div class="row"><strong>${e(x.job_type)}</strong>${badge(x.status)}</div><div class="tiny mono">${e(x.partition_key)}</div><div class="post-meta"><span>${e(x.attempt_count)} / ${e(x.max_attempts)} attempts</span><span>${e(when(x.updated_at))}</span></div></div>`).join('')||'<div class="empty">No workflow jobs: no resumable backfill has been scheduled in this database.</div>'}</section><section class="section"><div class="section-head"><h2>Quality reports</h2><span class="tiny">click to inspect checks</span></div>${quality.map(x=>`<div class="post clickable open-quality" data-id="${e(x.data_quality_report_id)}"><div class="row"><strong>${e(x.symbol)} · ${e(x.timeframe)}</strong>${badge(x.status)}</div><div class="tiny">${e(x.dataset_type)} · ${e(x.record_count)} rows · ${e(when(x.created_at))}</div></div>`).join('')||'<div class="empty">No quality reports</div>'}</section></div>`;document.querySelectorAll('.pipeline-toggle').forEach(b=>b.onclick=()=>proposeSimple(b.dataset.enabled==='true'?'pipeline.pause':'pipeline.resume','pipeline',b.dataset.name,`Administrator ${b.dataset.enabled==='true'?'paused':'enabled'} ${b.dataset.name} pipeline`,{}));document.querySelectorAll('.open-job').forEach(x=>x.onclick=()=>openDiagnostic(`/v1/workflow-jobs/${encodeURIComponent(x.dataset.id)}`,'Workflow job'));document.querySelectorAll('.open-quality').forEach(x=>x.onclick=()=>openDiagnostic(`/v1/data-quality/${encodeURIComponent(x.dataset.id)}`,'Data quality report'))}
async function openDiagnostic(url,title){try{const value=await api(url),modal=$('#modal');modal.classList.remove('hidden');modal.innerHTML=`<section class="modal-card" style="width:min(900px,100%)"><div class="eyebrow">Audit detail</div><h2 style="margin:8px 0 14px">${e(title)}</h2><pre>${e(j(value))}</pre><div class="actions"><button id="close-modal">Close</button></div></section>`;$('#close-modal').onclick=()=>modal.classList.add('hidden')}catch(err){toast(String(err))}}
async function renderModels(){const routes=await api('/v1/llm/routes');state.routes=routes;const labels={interactive_explanation:'Interactive explanation',routine_pipeline:'Routine pipeline',critical_research:'Critical research',strategy_generation:'Strategy generation',strategy_critique:'Strategy critique'};$('#content').innerHTML=heading('Model routing','按 workload 分配 premium 与 value model；变更形成不可变 revision。')+`<div class="grid">${Object.entries(routes.providers).map(([name,p])=>`<div class="card"><div class="row"><div class="eyebrow">${e(name)}</div>${badge(p.configured?'configured':'missing key')}</div><h2 style="margin-top:10px">${e(p.model)}</h2><p>${e(p.cost_tier)} · reasoning ${e(p.reasoning_effort)}</p></div>`).join('')}</div><section class="section section-pad" style="margin-top:14px"><div class="form">${Object.entries(labels).map(([key,label])=>`<div class="field"><label>${e(label)}</label><select data-route="${e(key)}"><option value="openai" ${routes.routes[key]==='openai'?'selected':''}>${e(routes.providers.openai.model)}</option><option value="meta" ${routes.routes[key]==='meta'?'selected':''}>${e(routes.providers.meta.model)}</option></select></div>`).join('')}<div class="field"><label>Change reason</label><input id="route-reason" value="Administrator updated workload allocation"></div><button id="save-routes" class="primary">Preview routing revision</button><div class="tiny">${e(routes.route_source)} · ${e(routes.routing_version)} · ${e(short(routes.routing_sha256))}</div></div></section>`;$('#save-routes').onclick=async()=>{const updated={};document.querySelectorAll('[data-route]').forEach(x=>updated[x.dataset.route]=x.value);try{const action=await api('/v1/llm/routes',{method:'PUT',body:j({routes:updated,reason:$('#route-reason').value})});showConfirmation(action)}catch(err){toast(String(err))}}}
async function renderActivity(){const[events,actionValues]=await Promise.all([api('/v1/events?limit=100'),api('/v1/actions?limit=100')]);$('#content').innerHTML=heading('Activity & audit','系统事件与管理员操作的联合审计视图。')+`<div class="split"><section class="section"><div class="section-head"><h2>Ledger events</h2><span class="tiny">append-only</span></div>${events.map(x=>`<div class="post"><div class="row"><strong>${e(x.event_type)}</strong><span class="tiny">#${e(x.sequence)}</span></div><div class="post-meta"><span class="mono">${e(short(x.correlation_id))}</span><span>${e(when(x.emitted_at))}</span></div></div>`).join('')||'<div class="empty">No events</div>'}</section><section class="section"><div class="section-head"><h2>Admin actions</h2><span class="tiny">two-step</span></div>${actionValues.map(actionCard).join('')||'<div class="empty">No actions</div>'}</section></div>`;bindActionButtons()}
async function renderCode(){const sessions=await api('/v1/code-changes');$('#content').innerHTML=heading('Code change sessions','总管只能创建隔离、限域、可审查的任务；diff 与测试通过后仍需确认 commit。')+`<section class="section section-pad"><div class="form"><div class="field"><label>Requested change</label><textarea id="code-request" placeholder="Describe the bug or bounded change…"></textarea></div><div class="field"><label>Allowed repository paths (comma separated)</label><input id="code-scope" value="src/agentic_quant, tests"></div><button id="open-code" class="primary">Preview isolated session</button></div></section><section class="section"><div class="section-head"><h2>Sessions</h2><span class="tiny">No web shell</span></div>${sessions.map(x=>`<div class="post clickable open-code-session" data-id="${e(x.code_change_session_id)}"><div class="row"><strong>${e(x.request)}</strong>${badge(x.status)}</div><div class="tiny mono">${e(x.branch_name)} · base ${e(short(x.base_git_sha))}</div><div class="post-meta"><span>${e((x.scope_json||[]).join(', '))}</span><span>${e(when(x.updated_at))}</span></div></div>`).join('')||'<div class="empty">No code change sessions</div>'}</section>`;$('#open-code').onclick=async()=>{try{const scope=$('#code-scope').value.split(',').map(x=>x.trim()).filter(Boolean);const a=await api('/v1/actions',{method:'POST',body:j({action_type:'code_change.open',target_type:'repository',target_id:'agentic-quant',parameters:{request:$('#code-request').value,scope},reason:'Administrator requested an isolated code change'})});showConfirmation(a)}catch(err){toast(String(err))}};document.querySelectorAll('.open-code-session').forEach(x=>x.onclick=()=>openCodeSession(x.dataset.id))}
async function openCodeSession(id){const x=await api(`/v1/code-changes/${encodeURIComponent(id)}`);setContext('code_change',id,x.request);$('#content').innerHTML=heading('Code change review',x.request,'<button id="back">← Code changes</button>')+`<div class="split"><section class="section section-pad"><div class="row"><h2>Session</h2>${badge(x.status)}</div><pre style="margin-top:14px">${e(j({branch:x.branch_name,base_git_sha:x.base_git_sha,scope:x.scope_json,requested_by:x.requested_by,created_at:x.created_at}))}</pre></section><section class="section section-pad"><h2>Test evidence</h2><pre style="margin-top:14px">${e(j(x.tests_json||[]))}</pre></section></div><section class="section section-pad"><h2>Candidate diff</h2><p class="tiny mono">SHA-256 ${e(x.diff_sha256||'not submitted')}</p><pre>${e(x.diff_text||'A trusted coding worker has not submitted a candidate yet.')}</pre>${x.status==='READY_FOR_APPROVAL'?'<button id="approve-code" class="primary" style="margin-top:12px">Preview commit approval</button>':''}</section>`;$('#back').onclick=()=>navigate('code');if($('#approve-code'))$('#approve-code').onclick=()=>proposeSimple('code_change.approve_commit','code_change',id,'Administrator approved the reviewed diff and passing tests',{})}
async function renderForum(type,id,title,prefetched=null){const root=$('#forum');if(!root)return;const discussion=prefetched||await api(`/v1/threads/${encodeURIComponent(type)}/${encodeURIComponent(id)}`);root.innerHTML=`<section class="section" style="margin-top:14px"><div class="section-head"><h2>Discussion & timeline</h2><span class="tiny">${e(title)}</span></div><div class="section-pad"><div id="posts">${discussion.posts.length?discussion.posts.map(p=>`<div class="post"><div class="post-meta"><span>${e(p.author_name)} · ${e(p.author_kind)}</span><span>${e(when(p.created_at))}</span></div><div class="post-body">${e(p.body)}</div></div>`).join(''):'<div class="empty">No discussion yet</div>'}</div><div class="form" style="margin-top:14px"><textarea id="post-body" placeholder="Add a durable note to this object…"></textarea><button id="add-post">Post note</button></div></div></section>`;$('#add-post').onclick=async()=>{try{await api(`/v1/threads/${encodeURIComponent(type)}/${encodeURIComponent(id)}`,{method:'POST',body:j({body:$('#post-body').value})});toast('Note posted');renderForum(type,id,title)}catch(err){toast(String(err))}}}
async function proposeSimple(action_type,target_type,target_id,reason,parameters){try{const a=await api('/v1/actions',{method:'POST',body:j({action_type,target_type,target_id,parameters,reason})});showConfirmation(a)}catch(err){toast(String(err))}}
function stewardConversationRows(conversations){return conversations.map(item=>`<button class="conversation-item ${item.conversation_id===state.conversation?'active':''}" data-conversation-id="${e(item.conversation_id)}" data-context-type="${e(item.context_object_type||'')}" data-context-id="${e(item.context_object_id||'')}"><strong>${e(item.title)}</strong><span>${e(when(item.updated_at))}</span></button>`).join('')||'<div class="empty">还没有对话</div>'}
async function renderSteward(){const conversations=await api('/v1/steward/conversations?limit=50');$('#content').innerHTML=`<div class="steward-page"><aside class="conversation-panel"><div class="conversation-panel-head"><div><div class="eyebrow">Conversations</div><div class="tiny">Persistent history</div></div><button id="new-conversation" title="New conversation">＋</button></div><div class="conversation-help">继续同一主题就沿用当前对话；切换到无关任务或希望清空上下文时再点＋。每次调用只携带最近 6 条消息和与问题相关的系统切片。</div><div id="conversation-list" class="conversation-list">${stewardConversationRows(conversations)}</div></aside><section class="steward-workspace"><header class="steward-head"><div class="steward-title"><div class="orb"></div><div><h1>System Steward</h1><div id="steward-model" class="tiny">System-aware · Markdown · confirmation-gated</div></div></div><button id="steward-context" class="context" title="Clear object context">Context · ${e(state.context.label)}</button></header><div id="chat" class="chat"><div id="steward-welcome" class="steward-welcome"><div class="orb"></div><h1>你的系统总管</h1><p class="muted">我可以读取系统全局状态、解释数据与策略、检查 shadow 运行，并提出需要你确认的管理操作。</p><div class="prompt-grid"><button class="prompt-chip" data-prompt="请用 Markdown 表格总结当前系统状态、数据覆盖和需要我关注的问题。">总结系统状态与风险</button><button class="prompt-chip" data-prompt="目前有哪些 strategy？请比较它们的证据、状态和下一步。">比较现有策略</button><button class="prompt-chip" data-prompt="检查数据 pipeline 和 data quality，告诉我是否有异常。">检查数据管线健康度</button><button class="prompt-chip" data-prompt="总结当前 shadow trading 的部署、交易和表现。">解释 Shadow 运行情况</button></div></div></div><footer class="steward-compose"><textarea id="steward-input" maxlength="20000" placeholder="询问系统状态、数据、策略，或要求我提出一个管理操作…"></textarea><div class="compose-row"><span class="compose-hint">⌘ / Ctrl + Enter 发送 · 敏感操作仍需单独确认</span><div class="compose-controls"><select id="steward-provider" aria-label="Model provider"><option value="">Auto route</option><option value="openai">OpenAI</option><option value="meta">Meta</option></select><button id="steward-send" class="primary">Send</button></div></div></footer></section></div>`;bindStewardWorkspace();if(state.conversation){try{await openStewardConversation(state.conversation)}catch(err){state.conversation=null;toast(String(err))}}}
function bindConversationItems(){document.querySelectorAll('[data-conversation-id]').forEach(button=>button.onclick=()=>{state.context={type:button.dataset.contextType||null,id:button.dataset.contextId||null,label:button.dataset.contextType?`${button.dataset.contextType} · ${short(button.dataset.contextId)}`:'Whole system'};openStewardConversation(button.dataset.conversationId)})}
function bindStewardWorkspace(){const send=$('#steward-send'),input=$('#steward-input');send.onclick=sendSteward;input.onkeydown=event=>{if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){event.preventDefault();sendSteward()}};$('#new-conversation').onclick=resetStewardConversation;$('#steward-context').onclick=()=>{setContext();toast('Conversation context reset to whole system')};bindConversationItems();document.querySelectorAll('[data-prompt]').forEach(button=>button.onclick=()=>{input.value=button.dataset.prompt;input.focus()});input.focus()}
function resetStewardConversation(){state.conversation=null;setContext();document.querySelectorAll('.conversation-item').forEach(item=>item.classList.remove('active'));const chat=$('#chat');chat.innerHTML='<div id="steward-welcome" class="steward-welcome"><div class="orb"></div><h1>开始新的对话</h1><p class="muted">我会在第一次发送后创建并持久化这段对话。</p></div>';$('#steward-model').textContent='System-aware · Markdown · confirmation-gated';$('#steward-input').focus()}
async function openStewardConversation(conversationId){const result=await api(`/v1/steward/conversations/${encodeURIComponent(conversationId)}`);state.conversation=conversationId;document.querySelectorAll('.conversation-item').forEach(item=>item.classList.toggle('active',item.dataset.conversationId===conversationId));setContext(state.context.type,state.context.id,state.context.label);const chat=$('#chat');chat.innerHTML='';result.messages.forEach(message=>addBubble(message.role,message.content,message.citations||[],message));if(!result.messages.length)resetStewardConversation()}
async function refreshStewardConversations(){const list=$('#conversation-list');if(!list)return;const conversations=await api('/v1/steward/conversations?limit=50');list.innerHTML=stewardConversationRows(conversations);bindConversationItems()}
function addBubble(kind,text,citations=[],metadata={}){const chat=$('#chat');if(!chat)return;const welcome=$('#steward-welcome');if(welcome)welcome.remove();const bubble=document.createElement('article');bubble.className=`bubble ${kind}`;const role=document.createElement('div');role.className='message-role';role.textContent=kind==='assistant'?'System Steward':kind==='user'?'You':'System';bubble.append(role);const body=document.createElement('div');if(kind==='assistant'){body.className='markdown-body';body.innerHTML=renderMarkdown(text)}else{body.textContent=text}bubble.append(body);if(citations.length){const citationRoot=document.createElement('div');citationRoot.className='citations';citations.forEach(value=>{const citation=document.createElement('span');citation.className='citation';citation.textContent=value;citationRoot.append(citation)});bubble.append(citationRoot)}const invocationId=metadata.llm_invocation_id||metadata.invocation_id;if(kind==='assistant'&&invocationId){const tools=document.createElement('div');tools.className='message-tools';const inspect=document.createElement('button');inspect.textContent='Inspect prompt · usage · cost';inspect.onclick=()=>openInvocation(invocationId);tools.append(inspect);bubble.append(tools)}chat.append(bubble);chat.scrollTop=chat.scrollHeight}
async function openInvocation(id){try{const value=await api(`/v1/llm/invocations/${encodeURIComponent(id)}`),modal=$('#modal');modal.classList.remove('hidden');modal.innerHTML=`<section class="modal-card" style="width:min(960px,100%)"><div class="eyebrow">Sanitized provider request</div><div class="row" style="margin:8px 0 14px"><h2>${e(value.provider)} · ${e(value.model)}</h2>${badge(value.status)}</div>${metrics([['Estimated cost',formatUsd(value.estimated_cost_usd),'planning rate'],['Input tokens',formatTokens(value.usage?.input_tokens),'diagnostic'],['Output tokens',formatTokens(value.usage?.output_tokens),'includes reasoning'],['Latency',`${value.latency_ms} ms`,value.prompt_version]])}<pre>${e(j(value.request_envelope||{note:'Prompt capture predates the inspector.'}))}</pre><div class="actions"><button id="close-modal">Close</button></div></section>`;$('#close-modal').onclick=()=>modal.classList.add('hidden')}catch(err){toast(String(err))}}
async function sendSteward(){const input=$('#steward-input'),message=input.value.trim();if(!message)return;input.value='';addBubble('user',message);const button=$('#steward-send');button.disabled=true;button.textContent='Thinking…';try{const result=await api('/v1/steward/ask',{method:'POST',body:j({message,conversation_id:state.conversation,context_object_type:state.context.type,context_object_id:state.context.id,provider:$('#steward-provider').value||null})});state.conversation=result.conversation_id;addBubble('assistant',result.answer,result.citations,result);$('#steward-model').textContent=`${result.model} · ${result.latency_ms} ms · ${formatUsd(result.estimated_cost_usd)} estimated · Markdown`;if(result.proposed_action){const wrapper=document.createElement('div');wrapper.className='action-card';wrapper.innerHTML=`<strong>${e(result.proposed_action.preview?.summary||result.proposed_action.action_type)}</strong><p>${e(result.proposed_action.reason)}</p><button class="primary">Review confirmation</button>`;wrapper.querySelector('button').onclick=()=>showConfirmation(result.proposed_action);$('#chat').append(wrapper);$('#chat').scrollTop=$('#chat').scrollHeight}await refreshStewardConversations()}catch(err){addBubble('assistant',`## 无法完成请求\n\n${String(err)}`)}finally{button.disabled=false;button.textContent='Send';input.focus()}}
async function renderShadowEnhanced(){const account=await api('/v1/shadow/account');await renderShadow();const first=$('#content .metrics');if(first)first.insertAdjacentHTML('afterend',`<section class="section section-pad"><div class="row wrap"><div><div class="eyebrow">Shared virtual master</div><h2 style="margin-top:7px">${e(account.name)}</h2></div>${badge(account.status)}</div>${metrics([['Cash',formatUsd(account.cash_balance),'single source of truth'],['Available cash',formatUsd(account.available_cash),'after open-plan reservations'],['Reserved risk',formatUsd(account.reserved_risk_usd),`of ${formatUsd(account.maximum_concurrent_risk_usd)}`],['Risk revision',account.risk_revision,account.base_policy_version]])}<p class="muted">Every strategy/symbol deployment is an attribution sleeve. Plans reserve this account atomically, so strategies cannot spend duplicate capital or portfolio risk.</p><button id="edit-account-risk" style="margin-top:10px">Edit risk limits</button></section>`);if($('#edit-account-risk'))$('#edit-account-risk').onclick=()=>openAccountRiskEditor(account)}
function openAccountRiskEditor(account){const modal=$('#modal');modal.classList.remove('hidden');modal.innerHTML=`<section class="modal-card"><div class="eyebrow">Confirmed account revision</div><h2 style="margin:8px 0 14px">Shared virtual risk limits</h2><div class="form"><div class="field"><label>Initial risk fraction</label><input id="risk-fraction" value="${e(account.initial_risk_fraction)}"></div><div class="field"><label>Maximum risk per trade (USD)</label><input id="risk-trade" value="${e(account.maximum_trade_risk_usd)}"></div><div class="field"><label>Maximum concurrent risk (USD)</label><input id="risk-concurrent" value="${e(account.maximum_concurrent_risk_usd)}"></div><div class="field"><label>Daily loss stop (USD)</label><input id="risk-daily" value="${e(account.daily_loss_stop_usd)}"></div><div class="field"><label>Account floor (USD)</label><input id="risk-floor" value="${e(account.account_floor_usd)}"></div><div class="field"><label>Reason</label><input id="risk-reason" value="Administrator revised shared virtual risk limits"></div><div class="tiny">Changing these values creates an immutable revision and invalidates older exact validation certificates.</div><div class="actions"><button id="close-modal">Cancel</button><button id="save-account-risk" class="primary">Preview revision</button></div></div></section>`;$('#close-modal').onclick=()=>modal.classList.add('hidden');$('#save-account-risk').onclick=async()=>{try{modal.classList.add('hidden');await proposeSimple('account.risk.update','virtual_account',account.virtual_account_id,$('#risk-reason').value,{limits:{initial_risk_fraction:$('#risk-fraction').value,maximum_trade_risk_usd:$('#risk-trade').value,maximum_concurrent_risk_usd:$('#risk-concurrent').value,daily_loss_stop_usd:$('#risk-daily').value,account_floor_usd:$('#risk-floor').value}})}catch(err){toast(String(err))}}}
async function renderPipelinesEnhanced(){const coordinator=await api('/v1/coordinator/status');await renderPipelines();const cycles=coordinator.cycles||[];$('#content').insertAdjacentHTML('beforeend',`<section class="section"><div class="section-head"><h2>Autonomous research coordinator</h2><span class="tiny">${e(coordinator.stages.length)} durable stages</span></div><div class="section-pad"><p class="muted">Market data → features → ML → forecast → Research LLM → strategy → exact validation → human shadow gate. WAITING is a prerequisite, not a worker failure.</p>${cycles.slice(0,5).map(c=>`<div class="post"><div class="row"><strong class="mono">${e(short(c.job_group_id))}</strong>${badge(c.status_counts.FAILED?'attention':c.status_counts.PENDING?'running':'complete')}</div><div class="tiny">${e(j(c.status_counts))}</div></div>`).join('')||'<div class="empty">No coordinator cycle yet. The worker creates one when enabled and the trading universe is non-empty.</div>'}</div></section>`)}
