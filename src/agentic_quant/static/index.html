<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Quant — Control Center</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --ink:#f4f5ef;--muted:#929c9a;--bg:#080b0b;--panel:#101515;--line:#26302f;--mint:#8ee5c2;--mint2:#49b78e;--amber:#efba65;--red:#ef7970;--shadow:0 20px 60px rgba(0,0,0,.28) }
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink)}body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background:radial-gradient(circle at 76% -10%,rgba(70,147,119,.19),transparent 34%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,42px 42px,42px 42px}
    button,input,textarea,select{font:inherit}button{color:var(--ink);border:1px solid var(--line);background:#18201f;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{border-color:#4f6561;background:#1c2826}button:disabled{opacity:.45;cursor:not-allowed}button.primary{color:#07110e;background:var(--mint);border-color:var(--mint);font-weight:750}button.danger{border-color:#79413d;color:#ffc0ba;background:#2b1716}input,textarea,select{width:100%;border:1px solid var(--line);background:#0b1010;color:var(--ink);border-radius:9px;padding:10px 11px}input:focus,textarea:focus,select:focus{outline:2px solid rgba(142,229,194,.24);border-color:var(--mint2)}textarea{resize:vertical;min-height:92px;line-height:1.5}a{color:var(--mint)}
    .hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.eyebrow{color:var(--mint);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:.84em;overflow-wrap:anywhere}
    .login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;background:#080b0b}.login::before{content:"AQ";position:absolute;font:900 min(36vw,480px)/1 Inter,sans-serif;color:rgba(142,229,194,.025)}.login-card{position:relative;width:min(430px,100%);background:#111716;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--mint);color:#07110e;font-weight:900;margin-bottom:36px}.login h1{font-size:30px;letter-spacing:-.035em;margin:7px 0 8px}.stack{display:grid;gap:11px}.login .stack{margin-top:25px}.error{color:#ffaaa3;min-height:20px;font-size:13px}
    .shell{position:relative;display:grid;grid-template-columns:228px minmax(520px,1fr) 372px;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:21px 16px;border-right:1px solid var(--line);background:rgba(9,13,13,.9);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 25px}.brand .mark{width:31px;height:31px;margin:0;border-radius:8px;font-size:13px}.brand strong{letter-spacing:-.02em}nav{display:grid;gap:3px}.nav{display:flex;gap:10px;align-items:center;width:100%;border-color:transparent;background:transparent;color:#aab3b1;text-align:left;padding:10px 11px}.nav.active{color:var(--ink);border-color:#2d3b39;background:#161e1d}.nav-icon{width:17px;text-align:center;color:var(--mint)}.sidebar-foot{position:absolute;bottom:18px;left:16px;right:16px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#0e1413}
    .main{min-width:0;padding:25px 29px 70px}.topbar{display:flex;justify-content:space-between;align-items:center;min-height:42px;margin-bottom:37px}.top-actions{display:flex;gap:8px;align-items:center}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;color:#c1cbc8}.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}.dot.warn{background:var(--amber);box-shadow:none}.dot.bad{background:var(--red);box-shadow:none}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}h1,h2,h3{margin:0;letter-spacing:-.025em}h1{font-size:30px}h2{font-size:20px}h3{font-size:15px}.page-head p{margin:6px 0 0;color:var(--muted)}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:20px}.metric,.card,.section{border:1px solid var(--line);background:rgba(16,21,21,.9);border-radius:13px}.metric{padding:15px;min-height:102px}.metric .value{margin-top:16px;font-size:25px;font-weight:730;letter-spacing:-.035em}.metric .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.section{margin-bottom:14px;overflow:hidden}.section-pad{padding:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:16px}.clickable{cursor:pointer;transition:.16s transform,.16s border-color}.clickable:hover{transform:translateY(-1px);border-color:#536a65}.card p{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}
    .badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#b7c2c0}.badge.ok{border-color:#316751;color:var(--mint)}.badge.warn{border-color:#705a34;color:#ffd18a}.badge.bad{border-color:#713d39;color:#ffaaa3}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{background:#1a2422;border:1px solid #2b3a37;border-radius:6px;padding:4px 7px;font-size:11px}table{width:100%;border-collapse:collapse;font-size:12px}th{color:var(--muted);font-weight:600;text-align:left}th,td{padding:11px 13px;border-bottom:1px solid #202827;vertical-align:top}tbody tr.clickable:hover{background:#151d1c}.empty{padding:36px 18px;text-align:center;color:var(--muted)}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}pre{margin:0;max-height:480px;overflow:auto;background:#090d0d;padding:14px;border:1px solid #202827;border-radius:9px;color:#c2d0cc;white-space:pre-wrap;word-break:break-word}
    .timeline{display:grid;gap:0}.timeline-item{position:relative;padding:0 0 19px 25px;border-left:1px solid #34433f}.timeline-item::before{content:"";position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--mint2)}.timeline-item:last-child{border-left-color:transparent}.post{padding:14px 0;border-bottom:1px solid #202827}.post:last-child{border:0}.post-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:7px}.post-body{white-space:pre-wrap;line-height:1.5;font-size:13px}
    .steward{position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:#0d1212;display:flex;flex-direction:column}.steward-head{padding:19px;border-bottom:1px solid var(--line)}.steward-title{display:flex;align-items:center;gap:10px;margin-top:7px}.orb{width:30px;height:30px;border:1px solid #4e8b75;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b7f5da,#3b876c 37%,#122b23 70%);box-shadow:0 0 25px rgba(91,199,156,.25)}.context{margin:12px 0 0;padding:8px 9px;background:#141c1b;border-radius:7px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:11px}.bubble{max-width:92%;padding:11px 12px;border-radius:12px;line-height:1.5;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#274d41}.bubble.assistant{align-self:flex-start;background:#17201f;border:1px solid #293734}.bubble.system{align-self:center;color:var(--muted);font-size:11px;text-align:center}.citations{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.citation{color:var(--mint);font:10px "SFMono-Regular",monospace}.action-card{border:1px solid #785e34;background:#241d12;border-radius:11px;padding:12px;font-size:12px}.action-card pre{max-height:150px;margin:9px 0;font-size:10px}.steward-compose{border-top:1px solid var(--line);padding:13px;display:grid;gap:8px}.compose-row{display:grid;grid-template-columns:1fr auto;gap:7px}.compose-row select{width:110px}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;background:#1b2523;border:1px solid #41544f;border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px}.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px}.modal-card{width:min(570px,100%);max-height:86vh;overflow:auto;background:#121817;border:1px solid #3c4d49;border-radius:15px;padding:22px;box-shadow:var(--shadow)}.modal-card pre{margin:14px 0;max-height:260px;font-size:11px}.form{display:grid;gap:10px}.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.steward-toggle{display:none}
    @media(max-width:1180px){.shell{grid-template-columns:205px minmax(480px,1fr)}.steward{position:fixed;right:0;z-index:30;width:min(390px,92vw);box-shadow:var(--shadow);transform:translateX(102%);transition:.2s}.steward.open{transform:none}.steward-toggle{display:block}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.shell{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{padding:0 4px 12px}.sidebar nav{display:flex;overflow:auto}.nav{width:auto;white-space:nowrap}.sidebar-foot{display:none}.main{padding:18px 14px 60px}.topbar{margin-bottom:25px}.grid,.grid.three,.split{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.page-head{align-items:start;flex-direction:column}.hide-mobile{display:none}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <form id="login-form" class="login-card">
      <div class="mark">AQ</div><div class="eyebrow">Private control plane</div><h1>欢迎回来</h1><p class="muted">登录后才能查看数据、研究与 shadow 操作。</p>
      <div class="stack"><input id="username" autocomplete="username" placeholder="Admin username" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="primary" type="submit">Unlock Control Center</button><div id="login-error" class="error"></div></div>
    </form>
  </section>
  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><div class="mark">AQ</div><div><strong>Agentic Quant</strong><div class="tiny">CONTROL CENTER</div></div></div>
      <nav id="nav">
        <button class="nav active" data-page="overview"><span class="nav-icon">◫</span>Overview</button><button class="nav" data-page="lists"><span class="nav-icon">◎</span>Lists</button><button class="nav" data-page="data"><span class="nav-icon">≋</span>Data explorer</button><button class="nav" data-page="strategies"><span class="nav-icon">◇</span>Strategies</button><button class="nav" data-page="shadow"><span class="nav-icon">◉</span>Shadow</button><button class="nav" data-page="pipelines"><span class="nav-icon">↳</span>Pipelines</button><button class="nav" data-page="models"><span class="nav-icon">✦</span>Models</button><button class="nav" data-page="activity"><span class="nav-icon">↻</span>Activity</button><button class="nav" data-page="code"><span class="nav-icon">⌘</span>Code changes</button>
      </nav>
      <div class="sidebar-foot"><div class="eyebrow">Hard boundary</div><div style="margin-top:7px;font-size:12px">Shadow only<br><span class="muted">No broker order path</span></div></div>
    </aside>
    <main class="main"><header class="topbar"><div id="runtime-status" class="status"><span class="dot"></span><span>Connecting</span></div><div class="top-actions"><button id="runtime-button">Pause</button><button class="steward-toggle">Steward</button><button id="logout" class="hide-mobile">Log out</button></div></header><div id="content"><div class="empty">Loading system state…</div></div></main>
    <aside id="steward" class="steward"><div class="steward-head"><div class="eyebrow">One administrator</div><div class="steward-title"><div class="orb"></div><div><h2>System Steward</h2><div id="steward-model" class="tiny">System-aware · confirmation-gated</div></div></div><div id="steward-context" class="context">Context · Whole system</div></div><div id="chat" class="chat"><div class="bubble system">我能读取当前系统快照、解释对象并提出管理操作。所有敏感操作仍需你单独确认。</div></div><div class="steward-compose"><textarea id="steward-input" maxlength="20000" placeholder="问我系统现在的状态，或要求我提出一个操作…"></textarea><div class="compose-row"><select id="steward-provider"><option value="">Auto</option><option value="openai">OpenAI</option><option value="meta">Meta</option></select><button id="steward-send" class="primary">Send</button></div></div></aside>
  </div>
  <div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const state={session:null,system:null,summary:null,page:'overview',context:{type:null,id:null,label:'Whole system'},conversation:null,routes:null};
const $=s=>document.querySelector(s);const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const j=v=>JSON.stringify(v,null,2);const short=v=>String(v||'—').slice(0,12);const when=v=>v?new Date(v).toLocaleString():'—';
function csrf(){const found=document.cookie.split('; ').find(v=>v.startsWith('aq_csrf='));return found?decodeURIComponent(found.split('=').slice(1).join('=')):''}
async function api(url,options={}){const opts={...options,headers:{...(options.headers||{})}};if(opts.body&&!opts.headers['Content-Type'])opts.headers['Content-Type']='application/json';if(opts.method&&opts.method!=='GET')opts.headers['X-CSRF-Token']=csrf();const r=await fetch(url,opts);const p=await r.json().catch(()=>({detail:r.statusText}));if(r.status===401){showLogin();throw new Error('Login required')}if(!r.ok)throw new Error(p.detail||`Request failed (${r.status})`);return p}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}function badge(value){const s=String(value||'unknown');const cls=/active|ready|succeed|complete|configured|adopted/i.test(s)?'ok':/fail|reject|retire|missing/i.test(s)?'bad':'warn';return `<span class="badge ${cls}">${e(s)}</span>`}function setContext(type=null,id=null,label='Whole system'){state.context={type,id,label};$('#steward-context').textContent=`Context · ${label}`}function showLogin(){state.session=null;$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden')}
async function boot(){try{const session=await api('/v1/auth/session');if(!session.authenticated){showLogin();return}state.session=session;showApp();await refreshGlobal();navigate(location.hash.slice(1)||'overview')}catch(err){showLogin()}}
$('#login-form').onsubmit=async ev=>{ev.preventDefault();$('#login-error').textContent='Checking…';try{await api('/v1/auth/login',{method:'POST',body:j({username:$('#username').value,password:$('#password').value})});$('#password').value='';$('#login-error').textContent='';await boot()}catch(err){$('#login-error').textContent=String(err)}};$('#logout').onclick=async()=>{await api('/v1/auth/logout',{method:'POST'});showLogin()};
async function refreshGlobal(){const [system,summary]=await Promise.all([api('/v1/system/status'),api('/v1/control/summary')]);state.system=system;state.summary=summary;const paused=system.new_exposure_paused;$('#runtime-status').innerHTML=`<span class="dot ${paused?'warn':''}"></span><span>${e(system.environment)} · ${e(system.trading_mode)} · ${paused?'paused':'running'}</span>`;$('#runtime-button').textContent=paused?'Resume':'Pause';return {system,summary}}
$('#runtime-button').onclick=async()=>{const paused=state.system.new_exposure_paused;try{const action=await api(paused?'/v1/commands/resume':'/v1/commands/pause',{method:'POST',body:j({reason:`Administrator requested ${paused?'resume':'pause'} from Control Center`})});showConfirmation(action)}catch(err){toast(String(err))}};
$('#nav').onclick=ev=>{const b=ev.target.closest('[data-page]');if(b)navigate(b.dataset.page)};window.onhashchange=()=>{const page=location.hash.slice(1);if(page&&page!==state.page)navigate(page,false)};
async function navigate(page,push=true){state.page=page;setContext();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));if(push)history.replaceState(null,'',`#${page}`);$('#content').innerHTML='<div class="empty">Loading…</div>';try{await refreshGlobal();const renderers={overview:renderOverview,lists:renderLists,data:renderData,strategies:renderStrategies,shadow:renderShadow,pipelines:renderPipelines,models:renderModels,activity:renderActivity,code:renderCode};await(renderers[page]||renderOverview)()}catch(err){$('#content').innerHTML=`<div class="section section-pad error">${e(err)}</div>`}}
function heading(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">Phase 6 Control Plane</div><h1>${e(title)}</h1><p>${e(sub)}</p></div>${action}</div>`}function metrics(items){return `<div class="metrics">${items.map(([label,value,note])=>`<div class="metric"><div class="label">${e(label)}</div><div class="value">${e(value)}</div><div class="tiny">${e(note||'')}</div></div>`).join('')}</div>`}
async function renderOverview(){const c=state.summary.counts,s=state.summary;$('#content').innerHTML=heading('System overview','系统状态、对象规模与待确认管理动作。')+metrics([['Raw objects',c.raw_objects,'immutable archive'],['Market bars',c.market_bars,'normalized'],['Strategies',c.strategies,'versioned specs'],['Shadow events',c.shadow_events,'virtual only'],['Active shadow',s.shadow.active_shadow_deployments,'deployments'],['Pending actions',s.pending_actions.length,'confirmation required'],['Research analyses',c.research_analyses,'evidence-bound'],['ML models',c.ml_models,'registry entries']])+`<div class="split"><section class="section"><div class="section-head"><h2>Operating contract</h2>${badge(state.system.phase)}</div><div class="section-pad"><div class="timeline"><div class="timeline-item"><h3>Data → evidence</h3><p class="muted">Raw archive, normalized facts and point-in-time feature snapshots retain lineage.</p></div><div class="timeline-item"><h3>Research → validation</h3><p class="muted">ML and LLM are evidence inputs; deterministic gates decide eligibility.</p></div><div class="timeline-item"><h3>Adoption → shadow</h3><p class="muted">Human confirmation activates broker-free virtual accounting.</p></div><div class="timeline-item"><h3>No live execution</h3><p class="muted">There is no broker order path in this application.</p></div></div></div></section><section class="section"><div class="section-head"><h2>Pending confirmation</h2><span class="tiny">expires in 15 min</span></div><div id="pending-list">${s.pending_actions.length?s.pending_actions.map(actionCard).join(''):'<div class="empty">No pending actions</div>'}</div></section></div>`;bindActionButtons()}
function actionCard(a){return `<div class="card" style="border:0;border-bottom:1px solid var(--line);border-radius:0"><div class="row"><strong>${e(a.action_type)}</strong>${badge(a.status)}</div><p>${e(a.preview?.summary||a.reason)}</p><div class="tiny mono">${e(a.action_request_id)}</div>${a.status==='PENDING_CONFIRMATION'?`<button class="confirm-action primary" data-id="${e(a.action_request_id)}" style="margin-top:10px">Review & confirm</button>`:''}</div>`}function bindActionButtons(){document.querySelectorAll('.confirm-action').forEach(b=>b.onclick=async()=>{const a=(await api('/v1/actions')).find(x=>x.action_request_id===b.dataset.id);if(a)showConfirmation(a)})}
function showConfirmation(action){const modal=$('#modal');modal.classList.remove('hidden');modal.innerHTML=`<div class="modal-card"><div class="eyebrow">Explicit administrator confirmation</div><h2 style="margin-top:8px">${e(action.preview?.summary||action.action_type)}</h2><p class="muted">This operation has not executed. Review the immutable preview below.</p><pre>${e(j(action.preview))}</pre><div class="field"><label>Type the exact confirmation phrase</label><input id="confirm-phrase" autocomplete="off" value="${e(action.confirmation_phrase||'')}"></div><div class="actions"><button id="close-modal">Close</button><button id="cancel-action" class="danger">Discard request</button><button id="confirm-modal" class="primary">Confirm and execute</button></div><div id="modal-error" class="error"></div></div>`;$('#close-modal').onclick=()=>modal.classList.add('hidden');$('#cancel-action').onclick=async()=>{try{await api(`/v1/actions/${encodeURIComponent(action.action_request_id)}/cancel`,{method:'POST'});modal.classList.add('hidden');toast('Request cancelled');await navigate(state.page,false)}catch(err){$('#modal-error').textContent=String(err)}};$('#confirm-modal').onclick=async()=>{try{const result=await api(`/v1/actions/${encodeURIComponent(action.action_request_id)}/confirm`,{method:'POST',body:j({confirmation_phrase:$('#confirm-phrase').value})});modal.classList.add('hidden');toast(`Executed ${result.action_type}`);await navigate(state.page,false)}catch(err){$('#modal-error').textContent=String(err)}}}
async function renderLists(){const lists=await api('/v1/lists');$('#content').innerHTML=heading('System lists','可审计、可版本回溯的 universe、watchlist、candidate 与 shadow list。')+`<div class="grid three">${lists.map(x=>`<article class="card clickable open-list" data-id="${e(x.list_id)}"><div class="row"><div class="eyebrow">${e(x.list_type)}</div>${badge(x.mode)}</div><h2 style="margin-top:12px">${e(x.name)}</h2><p>${e(x.description)}</p><div class="chips">${x.members.slice(0,12).map(v=>`<span class="chip">${e(v)}</span>`).join('')}${x.member_count>12?`<span class="chip">+${x.member_count-12}</span>`:''}</div><div class="tiny" style="margin-top:15px">Revision ${e(x.current_revision)} · ${e(x.member_count)} members</div></article>`).join('')}</div>`;document.querySelectorAll('.open-list').forEach(x=>x.onclick=()=>openList(x.dataset.id))}

async function proposeSimple(action_type,target_type,target_id,reason,parameters){try{const a=await api('/v1/actions',{method:'POST',body:j({action_type,target_type,target_id,parameters,reason})});showConfirmation(a)}catch(err){toast(String(err))}}
function addBubble(kind,text,citations=[]){const b=document.createElement('div');b.className=`bubble ${kind}`;b.textContent=text;if(citations.length){const c=document.createElement('div');c.className='citations';citations.forEach(x=>{const q=document.createElement('span');q.className='citation';q.textContent=x;c.append(q)});b.append(c)}$('#chat').append(b);$('#chat').scrollTop=$('#chat').scrollHeight}
$('#steward-send').onclick=sendSteward;$('#steward-input').onkeydown=ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter')sendSteward()};async function sendSteward(){const input=$('#steward-input'),message=input.value.trim();if(!message)return;input.value='';addBubble('user',message);const button=$('#steward-send');button.disabled=true;button.textContent='Thinking…';try{const result=await api('/v1/steward/ask',{method:'POST',body:j({message,conversation_id:state.conversation,context_object_type:state.context.type,context_object_id:state.context.id,provider:$('#steward-provider').value||null})});state.conversation=result.conversation_id;addBubble('assistant',result.answer,result.citations);$('#steward-model').textContent=`${result.model} · ${result.latency_ms} ms`;if(result.proposed_action){const wrapper=document.createElement('div');wrapper.className='action-card';wrapper.innerHTML=`<strong>${e(result.proposed_action.preview?.summary||result.proposed_action.action_type)}</strong><p>${e(result.proposed_action.reason)}</p><button class="primary">Review confirmation</button>`;wrapper.querySelector('button').onclick=()=>showConfirmation(result.proposed_action);$('#chat').append(wrapper)}}catch(err){addBubble('assistant',`无法完成：${String(err)}`)}finally{button.disabled=false;button.textContent='Send';input.focus()}}
document.querySelectorAll('.steward-toggle').forEach(b=>b.onclick=()=>$('#steward').classList.toggle('open'));boot();
</script>
</body>
</html>
